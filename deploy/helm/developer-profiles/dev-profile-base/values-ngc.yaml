# NGC Cloud Inference — deploy without local GPUs
#
# Points the VSS agent at NGC-hosted NIM endpoints instead of deploying
# NIM models on-cluster. Requires only an NGC API key with NIM access.
#
# Usage:
#   helm dependency build deploy/helm/developer-profiles/dev-profile-base/
#
#   helm upgrade --install vss deploy/helm/developer-profiles/dev-profile-base/ \
#     -n vss --create-namespace \
#     -f deploy/helm/developer-profiles/dev-profile-base/values-openshift.yaml \
#     -f deploy/helm/developer-profiles/dev-profile-base/values-ngc.yaml \
#     --set-string ngc.apiKey="$NGC_API_KEY" \
#     --set global.externalHost=vss.${APPS_DOMAIN}

# Disable on-cluster NIM model serving (no GPU pods needed for inference)
nims:
  nemotron:
    enabled: false
  cosmos:
    enabled: false
  cosmos3:
    enabled: false

# Disable KServe model serving
openshift:
  ai:
    useKserve: false

# Point agent to NGC cloud endpoints
global:
  llmBaseUrl: "https://integrate.api.nvidia.com"
  vlmBaseUrl: "https://integrate.api.nvidia.com"
  llmName: "nvidia/nvidia-nemotron-nano-9b-v2"
  # VLM for NGC cloud (serverless integrate.api.nvidia.com).
  #
  # We use nemotron-nano-12b-v2-vl rather than the local-deploy default
  # (cosmos3-nano-reasoner): the Cosmos-3 family is entitlement-gated on the
  # serverless endpoint and returns 404 "Not found for account" for a standard
  # NGC developer key, whereas nemotron-nano-12b-v2-vl is available by default.
  # The VSS video_understanding tool's remote path samples JPEG frames and sends
  # them as base64 images (not a video_url), so any image-capable VL model works;
  # this one accepts image+video input over the OpenAI-compatible chat API and
  # pairs with the Nemotron LLM above. For on-cluster (KServe/NIM) deploys,
  # keep Cosmos3-Reasoner — see values-openshift.yaml.
  vlmName: "nvidia/nemotron-nano-12b-v2-vl"

# Pass NGC API key to the agent for cloud inference auth
agent:
  vss-agent:
    extraEnv:
      - name: NVIDIA_API_KEY
        value: "SET_VIA_HELM_SET"
      - name: OPENAI_API_KEY
        value: "SET_VIA_HELM_SET"
      # NGC cloud = remote VLM, so the agent downloads + OpenCV-decodes MP4s locally
      # (video_understanding frame_select). On-cluster paths decode on GPU and keep this false.
      - name: INSTALL_PROPRIETARY_CODECS
        value: "true"
      # NGC serverless VLM rejects prompts with >10 images. frame_select samples an
      # inclusive range from 0, so num_frames=N yields N+1 images -- cap at 9 to stay
      # within the 10-image limit (config.yml reads ${VIDEO_MAX_FRAMES:-30}).
      - name: VIDEO_MAX_FRAMES
        value: "9"
