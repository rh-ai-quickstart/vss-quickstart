# OpenShift / RHOAI values overlay for base profile.
#
# Before installing, export the required variables:
#
#   export NGC_CLI_API_KEY='<your NGC API key>'
#   export APPS_DOMAIN=$(oc get ingress.config.openshift.io/cluster \
#   -o jsonpath='{.spec.domain}')
#
# Install:
#   helm install vss . \
#   -f values-base.yaml \
#   -f values-openshift.yaml \
#   --set-string ngc.apiKey="$NGC_CLI_API_KEY" \
#   --set global.externalHost=vss.${APPS_DOMAIN} \
#   -n vss --create-namespace
#
# For KServe mode (RHOAI model serving instead of NIM Operator):
#   Add: --set openshift.ai.useKserve=true --set nims.enabled=false

global:
  openshift:
    enabled: true
  externalScheme: "https"
  imagePullSecrets:
    - name: ngc-secret

# Disable Kubernetes Ingress (replaced by OpenShift Routes in openshift-routes.yaml)
vssIngress:
  enabled: false

# -- NGC secrets --------------------------------------------------------------
ngc:
  createSecrets: true
  apiKey: ""    # set via --set ngc.apiKey=$NGC_API_KEY

# -- NIM model serving (default mode) ----------------------------------------
nims:
  global:
    pullSecretName: ngc-secret
    authSecretName: ngc-api
  nemotron:
    tolerations: &gpu-tolerations
      - key: nvidia.com/gpu
        effect: NoSchedule
        operator: Exists
  cosmos:
    enabled: true
    tolerations: *gpu-tolerations
  cosmos3:
    enabled: false
    tolerations: *gpu-tolerations

# -- VIOS: pod affinity + GPU tolerations ------------------------------------
vios:
  vss-vios-sensor:
    tolerations: *gpu-tolerations
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vss-vios-streamprocessing
            topologyKey: kubernetes.io/hostname
  vss-vios-streamprocessing:
    tolerations: *gpu-tolerations

# -- RTVI: null security contexts for restricted-v2 SCC ----------------------
rtvi:
  rtvi-embed:
    podSecurityContext: null
    securityContext: null
  rtvi-vlm:
    securityContext: null
    tolerations: *gpu-tolerations

# -- KServe model serving (alternative to NIM Operator) ----------------------
# When useKserve is true, templates/openshift-ai.yaml renders
# InferenceService + ServingRuntime + model-download Job + PVC
# for each model listed below. Also set nims.enabled: false.
openshift:
  ai:
    useKserve: false
    kserveModels:
      nemotron:
        enabled: true
        repoId: nvidia/Nemotron-Nano-9B-v2
        storage: 50Gi
        runtimeImage: "registry.redhat.io/rhoai/vllm-cuda-rhel9:latest"
        vllmArgs:
          - "--gpu-memory-utilization"
          - "0.90"
          - "--max-model-len"
          - "16384"
          - "--trust-remote-code"
        resources:
          limits:
            cpu: "12"
            memory: 48Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
      cosmos3:
        enabled: true
        repoId: nvidia/cosmos3-reasoner
        storage: 200Gi
        runtimeImage: "registry.redhat.io/rhoai/vllm-cuda-rhel9:latest"
        vllmArgs:
          - "--gpu-memory-utilization"
          - "0.90"
          - "--max-model-len"
          - "28000"
          - "--trust-remote-code"
        resources:
          limits:
            cpu: "12"
            memory: 96Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 48Gi
            nvidia.com/gpu: "1"
  gpuTolerations: *gpu-tolerations
