# OpenShift / RHOAI values overlay for base profile.
#
# Before installing, export the required variables:
#
#   export NGC_CLI_API_KEY='<your NGC API key>'
#   export APPS_DOMAIN=$(oc get ingress.config.openshift.io/cluster \
#   -o jsonpath='{.spec.domain}')
#
# Install (KServe on-cluster model serving):
#   helm install vss . \
#   -f values-base.yaml \
#   -f values-openshift.yaml \
#   --set-string ngc.apiKey="$NGC_CLI_API_KEY" \
#   --set openshift.ai.useKserve=true \
#   --set global.externalHost=vss.${APPS_DOMAIN} \
#   -n vss --create-namespace
#
# For NGC cloud inference instead: add -f values-ngc.yaml (omit useKserve).

global:
  openshift:
    enabled: true
    # -- Outbound TLS trust bundle -------------------------------------------
    # Creates an OpenShift-injected CA ConfigMap (templates/openshift-trusted-ca.yaml)
    # and mounts it into vss-agent so egress TLS to NGC cloud
    # (https://integrate.api.nvidia.com) and any corporate egress proxy verifies.
    # Without this the agent fails with "unable to get local issuer certificate".
    # The Cluster Network Operator populates the ca-bundle.crt key.
    trustedCA:
      enabled: true
      configMapName: vss-combined-ca
      # -- build-ca-bundle initContainer image ---------------------------------
      # The vss-agent image is shell-less, so the concat step runs in a small
      # busybox image (defaults to the chart's waitForDependencies image). On a
      # disconnected cluster where docker.io/busybox is unreachable, override with
      # a mirrored equivalent, e.g.:
      #   buildImage: "registry.redhat.io/ubi9/ubi-minimal:latest"
      # buildImage: "busybox:1.37.0"
      # -- Extra CA ConfigMaps to append to the trust bundle (KServe path only) --
      # KServe serves each on-cluster model over HTTPS with a cert issued by the
      # OpenShift service-CA signer. aiohttp (agent -> model) can't skip verification
      # via env var, so the agent must trust that signer. templates/openshift-service-ca.yaml
      # creates vss-service-ca (annotated so OpenShift injects the signer into
      # service-ca.crt); an initContainer concatenates it with the CNO-managed cluster
      # bundle (which can't be hand-edited) into the one file SSL_CERT_FILE points at.
      # One signer covers every model — no per-model list to maintain. Reset to [] in
      # values-ngc.yaml (NGC endpoints are public HTTPS already covered by the cluster
      # bundle, and vss-service-ca isn't created on that path).
      extraCAConfigMaps:
        - name: vss-service-ca
          key: service-ca.crt
  externalScheme: "https"
  imagePullSecrets:
    - name: ngc-secret
  # -- KServe on-cluster model endpoints for vss-agent -------------------------
  # KServe names the model Service <llminferenceservice-name>-kserve-workload-svc
  # and vLLM serves HTTPS on 8000 (see TLS args in templates/openshift-ai.yaml).
  # The URL host MUST match a Subject Alternative Name on the service-CA serving
  # cert, whose SANs are namespace-qualified (<svc>.<ns>.svc and .svc.cluster.local)
  # -- there is no bare-name SAN -- so we use the <svc>.<ns>.svc form. NOTE the
  # "vss" here is the release namespace: change it if you install into another
  # namespace. The agent appends /v1. (For Option A, values-ngc.yaml layers after
  # this and overrides these URLs with the NGC cloud endpoint.)
  llmBaseUrl: "https://nvidia-nemotron-nano-9b-v2-kserve-workload-svc.vss.svc:8000"
  vlmBaseUrl: "https://nvidia-cosmos3-reasoner-kserve-workload-svc.vss.svc:8000"
  llmName: "nvidia/nvidia-nemotron-nano-9b-v2"
  vlmName: "nvidia/cosmos3-nano-reasoner"

# Disable Kubernetes Ingress (replaced by OpenShift Routes in openshift-routes.yaml)
vssIngress:
  enabled: false

# -- NGC secrets --------------------------------------------------------------
ngc:
  createSecrets: true
  apiKey: ""    # set via --set ngc.apiKey=$NGC_API_KEY

# -- Agent: route the VLM through the on-cluster vLLM (OpenAI-compatible) -------
# Default VLM_MODEL_TYPE=nim makes the agent treat any "cosmos" model as an NVIDIA
# NIM and send NIM-style mm_processor_kwargs (videos_kwargs.min_pixels/max_pixels).
# Cosmos3-Nano is served here via vLLM's Qwen3-VL processor, which rejects those
# kwargs (TypeError: unexpected keyword 'min_pixels'). Selecting the vllm_vlm
# profile (OpenAI-compatible, same VLM_BASE_URL) sets is_nim=false so those kwargs
# are omitted; frame count stays server-side via the model's --media-io-kwargs.
# OPENAI_API_KEY is required by the OpenAI client but unused (KServe serves the
# model without auth). NGC path replaces this extraEnv list (see values-ngc.yaml).
agent:
  vss-agent:
    image:
      repository: quay.io/tasmith/vss-agent
      tag: mlflow
      pullPolicy: Always
    extraEnv:
      - name: VLM_MODEL_TYPE
        value: "vllm"
      - name: OPENAI_API_KEY
        value: "EMPTY"
      # MLflow tracing is configured as literals in configs/vss-agent/config.yml
      # (general.telemetry.tracing.mlflow) — see the observability guide.
      # OTLP exporter ignores REQUESTS_CA_BUNDLE (defaults to certifi), so point it
      # at the combined trust bundle to verify MLflow's service-CA cert.
      - name: OTEL_EXPORTER_OTLP_CERTIFICATE
        value: /etc/pki/tls/custom-certs/ca-bundle.crt

# -- VIOS: pod affinity + GPU tolerations ------------------------------------
# NOTE: vss-vios-sensor defines the &gpu-tolerations anchor reused by all GPU
# workloads below (agent VLM/RTVI, KServe gpuTolerations).
vios:
  vss-vios-sensor:
    tolerations: &gpu-tolerations
      - key: nvidia.com/gpu
        effect: NoSchedule
        operator: Exists
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vss-vios-streamprocessing
            topologyKey: kubernetes.io/hostname
  vss-vios-streamprocessing:
    tolerations: *gpu-tolerations
    # -- MIG: uncomment to request a specific MIG slice instead of nvidia.com/gpu
    # resources:
    #   limits:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-2g.24gb: 1
    #   requests:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-2g.24gb: 1

# -- RTVI: null security contexts for restricted-v2 SCC ----------------------
rtvi:
  rtvi-embed:
    podSecurityContext: null
    securityContext: null
    # -- MIG: uncomment to request a specific MIG slice instead of nvidia.com/gpu
    # resources:
    #   limits:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-1g.12gb: 1
    #   requests:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-1g.12gb: 1
  rtvi-vlm:
    securityContext: null
    tolerations: *gpu-tolerations
    # -- MIG: uncomment to request a specific MIG slice instead of nvidia.com/gpu
    # resources:
    #   limits:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-2g.24gb: 1
    #   requests:
    #     nvidia.com/gpu: 0
    #     nvidia.com/mig-2g.24gb: 1

# -- UI: Red Hat branding (runtime, no image rebuild) ------------------------
# Mount the vss-ui-branding ConfigMap (ui-branding-configmap.yaml) over the
# stock NVIDIA logo/favicon via subPath so only those files are replaced and
# the runtime-generated public/__ENV.js and other assets are preserved. Path is
# the VSS app's runtime public dir (see services/ui/Dockerfile). Title is set in
# values.yaml (NEXT_PUBLIC_APP_TITLE); subtitle is unchanged.
vss-agent-ui:
  extraVolumes:
    - name: ui-branding
      configMap:
        name: vss-ui-branding
  extraVolumeMounts:
    - name: ui-branding
      mountPath: /repo/apps/nv-metropolis-bp-vss-ui/apps/nv-metropolis-bp-vss-ui/public/NV-logo-white.svg
      subPath: redhat-logo-white.svg
      readOnly: true
    - name: ui-branding
      mountPath: /repo/apps/nv-metropolis-bp-vss-ui/apps/nv-metropolis-bp-vss-ui/public/NV-logo-black.svg
      subPath: redhat-logo-black.svg
      readOnly: true
    - name: ui-branding
      mountPath: /repo/apps/nv-metropolis-bp-vss-ui/apps/nv-metropolis-bp-vss-ui/public/favicon.jpg
      subPath: favicon.jpg
      readOnly: true

# -- KServe model serving (on-cluster models via RHOAI) ----------------------

openshift:
  ai:
    useKserve: false
    # NOTE: the map key becomes the LLMInferenceService (and its Service) name.
    # These keys match the vss-agent's default in-cluster endpoints
    # (http://nvidia-nemotron-nano-9b-v2:8000, http://nvidia-cosmos3-reasoner:8000),
    # and each servedName matches the agent's default llmName / vlmName — so with
    # llmBaseUrl / vlmBaseUrl left blank the agent finds these models with no extra
    # config. If your KServe build exposes the model under a different Service DNS
    # name or port, set global.llmBaseUrl / global.vlmBaseUrl to the real endpoint.
    kserveModels:
      # -- LLM (summary + chat) -------------------------------------------------
      nvidia-nemotron-nano-9b-v2:
        enabled: true
        repoId: nvidia/NVIDIA-Nemotron-Nano-9B-v2   # public, ungated
        servedName: nvidia/nvidia-nemotron-nano-9b-v2
        # modelUri: hf://nvidia/NVIDIA-Nemotron-Nano-9B-v2   # override for pvc://, s3://, oci://
        runtimeImage: "registry.redhat.io/rhaii/vllm-cuda-rhel9:3.4.0"
        # Custom tool-call parser mounted from files/vllm-tool-parsers/<file> at
        # /opt/vss-tool-parsers (see openshift-ai.yaml). No built-in vLLM parser
        # matches Nemotron's <TOOLCALL>[...]</TOOLCALL> format.
        toolParserPluginFile: nemotron_toolcall_parser.py
        vllmArgs:
          - "--served-model-name"
          - "nvidia/nvidia-nemotron-nano-9b-v2"
          - "--gpu-memory-utilization"
          - "0.90"
          - "--max-model-len"
          - "32768"
          - "--trust-remote-code"
          - "--enable-auto-tool-choice"
          - "--tool-parser-plugin"
          - "/opt/vss-tool-parsers/nemotron_toolcall_parser.py"
          - "--tool-call-parser"
          - "nemotron_json"
          # float32 Mamba SSM cache required for accuracy
          - "--mamba_ssm_cache_dtype"
          - "float32"
        resources:
          limits:
            cpu: "12"
            memory: 48Gi
            nvidia.com/gpu: "1"
            # -- MIG: replace nvidia.com/gpu with MIG slice (~25GB model fits 3g.47gb)
            # nvidia.com/mig-3g.47gb: "1"
          requests:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
            # nvidia.com/mig-3g.47gb: "1"
      # -- VLM (frame captioning) ----------------------------------------------
      # Cosmos3-Nano (16B, omnimodal) is served via the NVIDIA cosmos3 vLLM build,
      # NOT the stock rhaii vLLM image: the vllm/vllm-omni:cosmos3 image ships the
      # vllm-cosmos3 plugin. VSS captions frames over /v1/chat/completions, so we
      # run the standard reasoning entrypoint (no --omni) with the Cosmos3Reasoner
      # architecture override. BF16 only — FP4/FP8/FP16 are not supported upstream.
      nvidia-cosmos3-reasoner:
        enabled: true
        repoId: nvidia/Cosmos3-Nano   # public, ungated
        servedName: nvidia/cosmos3-nano-reasoner
        # modelUri: hf://nvidia/Cosmos3-Nano   # override for pvc://, s3://, oci://
        runtimeImage: "vllm/vllm-omni:cosmos3"
        vllmArgs:
          - "--served-model-name"
          - "nvidia/cosmos3-nano-reasoner"
          # The vllm/vllm-omni:cosmos3 image (vLLM 0.25.0) registers Cosmos3 natively
          # as Cosmos3ForConditionalGeneration. (The Cosmos3Reasoner* name is only in
          # the standard-vLLM + vllm-cosmos3 plugin build, vllm==0.21.0 — not here.)
          - "--hf-overrides"
          - '{"architectures": ["Cosmos3ForConditionalGeneration"]}'
          - "--mm-encoder-tp-mode"
          - "data"
          - "--async-scheduling"
          - "--allowed-local-media-path"
          - "/"
          - "--media-io-kwargs"
          - '{"video": {"num_frames": -1}}'
          - "--gpu-memory-utilization"
          - "0.90"
          # -- Multi-GPU: uncomment for tensor parallelism across GPUs/MIG slices
          # - "--tensor-parallel-size"
          # - "2"
        resources:
          limits:
            cpu: "12"
            memory: 96Gi
            nvidia.com/gpu: "1"
            # -- MIG: replace nvidia.com/gpu with 2x 3g.47gb slices + tensor parallelism
            # nvidia.com/mig-3g.47gb: "2"
          requests:
            cpu: "4"
            memory: 48Gi
            nvidia.com/gpu: "1"
            # nvidia.com/mig-3g.47gb: "2"
  gpuTolerations: *gpu-tolerations
