# =====================================================================
# Long-lived service-account token for MLflow tracing auth.
#
# The vss-agent authenticates to the RHOAI MLflow tracking server with a
# Bearer token (see configs/vss-agent/config.yml -> telemetry.tracing.mlflow).
# Kubernetes auto-populates this Secret with a non-expiring token for the
# service account the agent runs as (the namespace "default" SA, since the
# agent subchart sets serviceAccount.create=false).
#
# Extract it after install and paste into the mlflow tracer's Authorization
# header in configs/vss-agent/config.yml:
#   oc get secret vss-mlflow-token -n <namespace> -o jsonpath='{.data.token}' | base64 -d
#
# The SA's workspace access is granted by mlflow-rbac.yaml (a Role on
# mlflow.kubeflow.org experiments in this namespace); without it MLflow
# returns 403 on span export.
# =====================================================================
{{- if .Values.global.openshift.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: vss-mlflow-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: mlflow-tracing
  annotations:
    kubernetes.io/service-account.name: default
    description: "Long-lived token for vss-agent -> RHOAI MLflow tracing auth"
type: kubernetes.io/service-account-token
{{- end }}
