{{- if and .Values.global.openshift.enabled .Values.openshift.ai.useKserve }}
# =====================================================================
# KServe model serving — on-cluster models via RHOAI.
# Gate: openshift.ai.useKserve=true
#
# Creates one LLMInferenceService per enabled model in
# openshift.ai.kserveModels. Model weights are pulled by KServe's
# storage-initializer directly from model.uri (hf:// by default) into
# /mnt/models — no manual download Job or PVC. Gated HuggingFace repos
# require a token secret (see hfTokenSecret / hfTokenKey below).
# =====================================================================

{{- range $name, $model := .Values.openshift.ai.kserveModels }}
{{- if $model.enabled }}
# ---------------------------------------------------------------
# {{ $name }} — LLMInferenceService (serving.kserve.io/v1alpha1)
# Model source: {{ $model.modelUri | default (printf "hf://%s" $model.repoId) }}
# ---------------------------------------------------------------
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    security.opendatahub.io/enable-auth: "false"
    openshift.io/display-name: {{ $model.displayName | default $name }}
    opendatahub.io/model-type: generative
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  model:
    # hf://<org>/<repo> by default; override with modelUri for pvc://, s3://, oci://, etc.
    uri: {{ $model.modelUri | default (printf "hf://%s" $model.repoId) }}
    name: {{ $model.servedName | default $model.repoId | quote }}
  replicas: {{ $model.replicas | default 1 }}
  {{- /* Gateway API routing. Set openshift.ai.router (or per-model router) to
         expose via a Gateway; omit for in-cluster Service access only. */}}
  {{- with (default $.Values.openshift.ai.router $model.router) }}
  router:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    containers:
    - name: main
      image: {{ required (printf "openshift.ai.kserveModels.%s.runtimeImage is required" $name) $model.runtimeImage }}
      command:
      - python
      - -m
      - vllm.entrypoints.openai.api_server
      args:
      - "--model"
      - "/mnt/models"
      # -- TLS: KServe LLMInferenceService expects the model to serve HTTPS on the
      # workload port and mounts a serving cert at /var/run/kserve/tls/. vLLM
      # terminates TLS from it so the (HTTPS-scheme) KServe probes and gateway
      # routing succeed. Clients (vss-agent) must therefore use https:// URLs.
      - "--ssl-certfile=/var/run/kserve/tls/tls.crt"
      - "--ssl-keyfile=/var/run/kserve/tls/tls.key"
      - "--enable-ssl-refresh"
      {{- range $model.vllmArgs }}
      - {{ . | quote }}
      {{- end }}
      env:
      # -- OpenShift arbitrary-UID compatibility --------------------------------
      # Pods run under the restricted-v2 SCC with a random UID that has no entry
      # in /etc/passwd and no home dir. Without USER/LOGNAME set, Python's
      # getpass.getuser() falls through to pwd.getpwuid() and crashes on import
      # ("KeyError: getpwuid(): uid not found"); torch/HF/vLLM also need a
      # writable HOME and cache dirs (the UID's default home is not writable).
      - name: USER
        value: "vllm"
      - name: LOGNAME
        value: "vllm"
      - name: HOME
        value: "/tmp"
      - name: XDG_CACHE_HOME
        value: "/tmp/.cache"
      - name: HF_HOME
        value: "/tmp/.cache/huggingface"
      - name: TORCHINDUCTOR_CACHE_DIR
        value: "/tmp/.cache/torchinductor"
      - name: TRITON_CACHE_DIR
        value: "/tmp/.cache/triton"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/.cache/vllm"
      # Storage-initializer downloads gated repos; the token secret must also be
      # visible to that init container on-cluster (see hfTokenSecret note in values).
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: {{ $model.hfTokenSecret | default "hf-token-secret" }}
            key: {{ $model.hfTokenKey | default "HF_TOKEN" }}
            optional: true
      {{- with $model.extraEnv }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      ports:
      # vLLM serves the OpenAI-compatible API (HTTPS, see TLS args) on 8000.
      - containerPort: 8000
        name: http
        protocol: TCP
      # Probes use scheme: HTTPS to match the TLS-terminating server above;
      # the long startup failureThreshold covers first-time weight download + load.
      startupProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        periodSeconds: 10
        failureThreshold: 60
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        periodSeconds: 10
        failureThreshold: 3
      resources:
        {{- toYaml $model.resources | nindent 8 }}
      # vLLM uses shared memory for its multiprocessing/NCCL paths; the 64Mi
      # container default is too small and can hang/crash larger or TP models.
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: {{ $model.shmSize | default "2Gi" }}
    {{- if $.Values.openshift.gpuTolerations }}
    tolerations:
      {{- toYaml $.Values.openshift.gpuTolerations | nindent 6 }}
    {{- end }}
    {{- if $.Values.global.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml $.Values.global.imagePullSecrets | nindent 6 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
