{{- if and .Values.global.openshift.enabled .Values.openshift.ai.useKserve }}
# =====================================================================
# KServe model serving — on-cluster models via RHOAI.
# Gate: openshift.ai.useKserve=true
#
# Creates one LLMInferenceService per enabled model in
# openshift.ai.kserveModels. Model weights are pulled by KServe's
# storage-initializer directly from model.uri (hf:// by default) into
# /mnt/models — no manual download Job or PVC. Gated HuggingFace repos
# require a token secret (see hfTokenSecret / hfTokenKey below).
# =====================================================================

{{- range $name, $model := .Values.openshift.ai.kserveModels }}
{{- if $model.enabled }}
# ---------------------------------------------------------------
# {{ $name }} — LLMInferenceService (serving.kserve.io/v1alpha1)
# Model source: {{ $model.modelUri | default (printf "hf://%s" $model.repoId) }}
# ---------------------------------------------------------------
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    security.opendatahub.io/enable-auth: "false"
    openshift.io/display-name: {{ $name }}
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  model:
    # hf://<org>/<repo> by default; override with modelUri for pvc://, s3://, oci://, etc.
    uri: {{ $model.modelUri | default (printf "hf://%s" $model.repoId) }}
    name: {{ $model.servedName | default $model.repoId | quote }}
  replicas: {{ $model.replicas | default 1 }}
  template:
    containers:
    - name: main
      image: {{ required (printf "openshift.ai.kserveModels.%s.runtimeImage is required" $name) $model.runtimeImage }}
      command:
      - python
      - -m
      - vllm.entrypoints.openai.api_server
      args:
      - "--model"
      - "/mnt/models"
      {{- range $model.vllmArgs }}
      - {{ . | quote }}
      {{- end }}
      env:
      # Storage-initializer downloads gated repos; the token secret must also be
      # visible to that init container on-cluster (see hfTokenSecret note in values).
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: {{ $model.hfTokenSecret | default "hf-token-secret" }}
            key: {{ $model.hfTokenKey | default "HF_TOKEN" }}
            optional: true
      ports:
      # vLLM's OpenAI-compatible server listens on 8000 by default; the vss-agent
      # targets the model services on :8000 (see agent chart llm/vlm endpoints).
      - containerPort: 8000
        protocol: TCP
      resources:
        {{- toYaml $model.resources | nindent 8 }}
    {{- if $.Values.openshift.gpuTolerations }}
    tolerations:
      {{- toYaml $.Values.openshift.gpuTolerations | nindent 6 }}
    {{- end }}
    {{- if $.Values.global.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml $.Values.global.imagePullSecrets | nindent 6 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
