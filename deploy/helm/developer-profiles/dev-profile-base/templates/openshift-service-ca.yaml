#
# Empty ConfigMap annotated so the service-CA operator injects the signer
# (openshift-service-serving-signer) into service-ca.crt. The agent trusts it to
# reach KServe models AND the RHOAI MLflow endpoint over HTTPS, so it's created on
# every openshift path (MLflow tracing needs it even when useKserve is false). Do
# NOT set data: — the operator owns that key.
{{- if .Values.global.openshift.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vss-service-ca
  namespace: {{ .Release.Namespace }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
