# =====================================================================
# OpenShift service-CA bundle for the vss-agent (KServe path only).
#
# KServe gives each on-cluster LLMInferenceService a serving cert issued
# by the OpenShift service-CA signer (openshift-service-serving-signer),
# and vLLM serves HTTPS with it. The agent calls those model endpoints
# over https://<svc>.<ns>.svc:8000, so it must trust that signer — a
# single CA that covers every service cert in the cluster (no per-model
# secret list to keep in sync).
#
# This ConfigMap is created empty but annotated so the OpenShift
# service-CA operator injects the signer's cert into its `service-ca.crt`
# key. The agent's build-ca-bundle initContainer concatenates it with the
# CNO-managed cluster bundle (vss-combined-ca) into the file SSL_CERT_FILE
# points at (see global.openshift.trustedCA.extraCAConfigMaps and
# services/agent/charts/agent). We intentionally do NOT set `data:` — the
# service-CA operator owns that key.
# =====================================================================
{{- if and .Values.global.openshift.enabled .Values.openshift.ai.useKserve }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vss-service-ca
  namespace: {{ .Release.Namespace }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
