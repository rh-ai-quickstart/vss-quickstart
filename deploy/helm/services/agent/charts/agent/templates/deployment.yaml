{{- if .Values.enabled }}
{{- $rt := .Values.reportTemplates | default dict }}
{{- /* Kubernetes rejects `items` keys missing from the ConfigMap; optional:true only helps when the CM itself is absent. */}}
{{- $mountReportTemplates := and (eq (.Values.profile | default "base") "alerts") ($rt.enabled | default false) }}
{{- /* Trusted-CA bundle for outbound TLS. Prefer subchart .Values.trustedCA; fall back to global.openshift.trustedCA. */}}
{{- $g := .Values.global | default dict }}
{{- $gTrust := (index ($g.openshift | default dict) "trustedCA") | default dict }}
{{- $trust := .Values.trustedCA | default dict }}
{{- $trustCM := $trust.configMapName | default ($gTrust.configMapName | default "") }}
{{- $trustEnabled := $trust.enabled | default ($gTrust.enabled | default false) }}
{{- $trustKey := $trust.key | default ($gTrust.key | default "ca-bundle.crt") }}
{{- $trustMount := $trust.mountPath | default ($gTrust.mountPath | default "/etc/pki/tls/custom-certs") }}
{{- $trustOn := and $trustEnabled (ne $trustCM "") }}
{{- $trustFile := printf "%s/%s" $trustMount $trustKey }}
{{- /* Extra CA ConfigMaps appended to the trust bundle at pod start — each an
       {name, key} whose data[key] is PEM. Used for the OpenShift service-CA signer
       (injected into vss-service-ca[service-ca.crt]) so aiohttp/requests verify the
       on-cluster KServe model HTTPS endpoints. The build-ca-bundle initContainer
       concatenates these with the CNO-managed cluster bundle (which cannot be
       hand-edited) into the single file SSL_CERT_FILE points at. */}}
{{- $trustExtra := $trust.extraCAConfigMaps | default ($gTrust.extraCAConfigMaps | default (list)) }}
{{- $trustCombine := and $trustOn (gt (len $trustExtra) 0) }}
{{- /* Image for the build-ca-bundle initContainer: the vss-agent image is
       shell-less (no sh/cat), so use a small busybox-style utility image. Defaults
       to the waitForDependencies image (busybox) already standardized in this chart;
       override via trustedCA.buildImage / global.openshift.trustedCA.buildImage for
       disconnected registries. */}}
{{- $wdImg := (.Values.waitForDependencies | default dict).image | default dict }}
{{- $wdImgStr := ternary (printf "%s:%s" ($wdImg.repository | default "busybox") ($wdImg.tag | default "1.37.0")) "busybox:1.37.0" (hasKey $wdImg "repository") }}
{{- $trustBuildImage := $trust.buildImage | default ($gTrust.buildImage | default $wdImgStr) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-agent.fullname" . }}
  labels:
    app.kubernetes.io/name: vss-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitDeps := and .Values.waitForDependencies .Values.waitForDependencies.enabled }}
      {{- if or $waitDeps $trustCombine }}
      initContainers:
      {{- end }}
      {{- if $trustCombine }}
        {{- /* Concatenate the CNO-managed cluster bundle with each extra CA ConfigMap
               into a single PEM on the shared emptyDir; SSL_CERT_FILE points here. */}}
        - name: build-ca-bundle
          image: {{ $trustBuildImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              : > {{ $trustFile }}
              if [ -f /ca-src/cluster/{{ $trustKey }} ]; then
                cat /ca-src/cluster/{{ $trustKey }} >> {{ $trustFile }}
              fi
              for f in /ca-src/extra/*/ca.crt; do
                [ -f "$f" ] || continue
                echo "" >> {{ $trustFile }}
                cat "$f" >> {{ $trustFile }}
              done
              echo "Wrote combined CA bundle to {{ $trustFile }}"
          volumeMounts:
            - name: trusted-ca
              mountPath: {{ $trustMount }}
            - name: trusted-ca-cluster
              mountPath: /ca-src/cluster
              readOnly: true
            {{- range $i, $s := $trustExtra }}
            - name: kca-{{ $i }}
              mountPath: /ca-src/extra/{{ $i }}
              readOnly: true
            {{- end }}
      {{- end }}
      {{- if $waitDeps }}
      {{- $g := .Values.global | default dict }}
      {{- $pfx := default false (coalesce .Values.useReleaseNamePrefix (index $g "useReleaseNamePrefix")) }}
      {{- $kafkaDef := ternary (printf "%s-kafka-kafka" .Release.Name) "kafka-kafka" $pfx }}
      {{- $redisDef := ternary (printf "%s-redis" .Release.Name) "redis" $pfx }}
      {{- $esDef := ternary (printf "%s-elasticsearch" .Release.Name) "elasticsearch" $pfx }}
      {{- $kafkaH := .Values.waitForDependencies.kafkaHost | default $kafkaDef }}
      {{- $redisH := .Values.waitForDependencies.redisHost | default $redisDef }}
      {{- $esH := .Values.waitForDependencies.elasticsearchHost | default $esDef }}
        - name: wait-for-kafka-redis-elasticsearch
          image: {{ .Values.waitForDependencies.image.repository }}:{{ .Values.waitForDependencies.image.tag }}
          imagePullPolicy: {{ .Values.waitForDependencies.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka {{ $kafkaH }}:{{ .Values.waitForDependencies.kafkaPort }}, Redis {{ $redisH }}:{{ .Values.waitForDependencies.redisPort }}, Elasticsearch {{ $esH }}:{{ .Values.waitForDependencies.elasticsearchPort }}"
              for i in $(seq 1 {{ .Values.waitForDependencies.maxRetries }}); do
                if nc -z {{ $kafkaH }} {{ .Values.waitForDependencies.kafkaPort }} 2>/dev/null \
                   && nc -z {{ $redisH }} {{ .Values.waitForDependencies.redisPort }} 2>/dev/null \
                   && nc -z {{ $esH }} {{ .Values.waitForDependencies.elasticsearchPort }} 2>/dev/null; then
                  echo "Kafka, Redis, and Elasticsearch are accepting connections"
                  exit 0
                fi
                echo "Attempt $i: waiting..."
                sleep {{ .Values.waitForDependencies.retryInterval }}
              done
              echo "Timeout waiting for Kafka, Redis, or Elasticsearch"
              exit 1
      {{- end }}
      containers:
        - name: vss-agent
          image: {{ include "vss-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config_file
            - {{ .Values.configFilePath | default "/etc/vss-agent/config.yml" }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/vss-agent/config.yml
              subPath: config.yml
              readOnly: true
            {{- if .Values.mountConfigEdge }}
            - name: config
              mountPath: /etc/vss-agent/config_edge.yml
              subPath: config_edge.yml
              readOnly: true
            {{- end }}
            {{- if $mountReportTemplates }}
            - name: report-templates
              mountPath: /etc/vss-agent/report-templates
              readOnly: true
            {{- end }}
            {{- if .Values.mountEvalOutput }}
            - name: eval-output
              mountPath: /vss-agent/eval-output
            {{- end }}
            {{- if $trustOn }}
            - name: trusted-ca
              mountPath: {{ $trustMount }}
              readOnly: true
            {{- end }}
          env:
            {{- /*
              Collect env, video-ingest timeouts, trusted-CA vars, and extraEnv into $pairs,
              then render deduped by name (last wins). Duplicate names break `helm upgrade`:
              the strategic-merge patch's $setElementOrder can't list a merge key twice.
            */}}
            {{- $pairs := list }}
            {{- range .Values.env }}
            {{- $pairs = append $pairs (dict "name" .name "value" (tpl (.value | default "" | toString) $)) }}
            {{- end }}
            {{- $videoIngestTimeouts := .Values.videoIngestTimeouts | default dict }}
            {{- with get $videoIngestTimeouts "vstUploadTimeoutSeconds" }}
            {{- $pairs = append $pairs (dict "name" "VIDEO_INGEST_VST_UPLOAD_TIMEOUT_SECONDS" "value" (tpl (. | toString) $)) }}
            {{- end }}
            {{- with get $videoIngestTimeouts "vstStorageTimeoutSeconds" }}
            {{- $pairs = append $pairs (dict "name" "VIDEO_INGEST_VST_STORAGE_TIMEOUT_SECONDS" "value" (tpl (. | toString) $)) }}
            {{- end }}
            {{- with get $videoIngestTimeouts "rtviCvTimeoutSeconds" }}
            {{- $pairs = append $pairs (dict "name" "VIDEO_INGEST_RTVI_CV_TIMEOUT_SECONDS" "value" (tpl (. | toString) $)) }}
            {{- end }}
            {{- with get $videoIngestTimeouts "rtviEmbedTimeoutSeconds" }}
            {{- $pairs = append $pairs (dict "name" "VIDEO_INGEST_RTVI_EMBED_TIMEOUT_SECONDS" "value" (tpl (. | toString) $)) }}
            {{- end }}
            {{- if $trustOn }}
            {{- /* Point OpenSSL, requests, and curl at the injected trust bundle so outbound TLS (e.g. NGC cloud) verifies. */}}
            {{- $pairs = append $pairs (dict "name" "SSL_CERT_FILE" "value" $trustFile) }}
            {{- $pairs = append $pairs (dict "name" "REQUESTS_CA_BUNDLE" "value" $trustFile) }}
            {{- $pairs = append $pairs (dict "name" "CURL_CA_BUNDLE" "value" $trustFile) }}
            {{- end }}
            {{- range (.Values.extraEnv | default list) }}
            {{- $pairs = append $pairs (dict "name" .name "value" (tpl (.value | default "" | toString) $)) }}
            {{- end }}
            {{- /* Dedupe by name (last definition wins), preserving first-seen order. */}}
            {{- $byName := dict }}
            {{- $order := list }}
            {{- range $pairs }}
            {{- if not (hasKey $byName .name) }}{{- $order = append $order .name }}{{- end }}
            {{- $_ := set $byName .name .value }}
            {{- end }}
            {{- range $order }}
            - name: {{ . }}
              value: {{ get $byName . | quote }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "vss-agent.fullname" . }}-config
        {{- if $mountReportTemplates }}
        - name: report-templates
          configMap:
            name: {{ include "vss-agent.fullname" . }}-config
            items:
              - key: {{ $rt.configMapKey | default "incident_report_template.md" }}
                path: {{ $rt.configMapKey | default "incident_report_template.md" }}
        {{- end }}
        {{- if .Values.mountEvalOutput }}
        - name: eval-output
          emptyDir: {}
        {{- end }}
        {{- if $trustOn }}
        - name: trusted-ca
          {{- if $trustCombine }}
          {{- /* build-ca-bundle writes the combined PEM here; shared with initContainer. */}}
          emptyDir: {}
          {{- else }}
          configMap:
            name: {{ $trustCM }}
            optional: true
          {{- end }}
        {{- end }}
        {{- if $trustCombine }}
        - name: trusted-ca-cluster
          configMap:
            name: {{ $trustCM }}
            optional: true
        {{- range $i, $s := $trustExtra }}
        - name: kca-{{ $i }}
          configMap:
            name: {{ $s.name }}
            optional: true
            items:
              - key: {{ $s.key | default "service-ca.crt" }}
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
