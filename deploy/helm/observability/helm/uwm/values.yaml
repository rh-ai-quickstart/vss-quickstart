global:
  targetNamespace: "vss"

clusterMonitoringConfig:
  enableUserWorkload: true
  prometheusK8s:
    retention: 168h
    volumeClaimTemplate:
      spec:
        storageClassName: nfs-client
        volumeMode: Filesystem
        resources:
          requests:
            storage: 40Gi

userWorkloadMonitoringConfig:
  prometheus:
    logLevel: debug
    retention: 72h
    volumeClaimTemplate:
      spec:
        storageClassName: nfs-client
        volumeMode: Filesystem
        resources:
          requests:
            storage: 40Gi
  alertmanager:
    enabled: true
    enableAlertmanagerConfig: true

# One PodMonitor per KServe model. Metrics are on the "http" port (8000), served
# over HTTPS — hence scheme: https + insecureSkipVerify (SAN mismatch on pod IP).
# Select LLMInferenceService workload pods by their app.kubernetes.io/* labels.
modelMetricsMonitors:
  nemotron:
    enabled: true
    name: vss-nemotron-metrics
    podMetricsEndpoints:
      - interval: 15s
        path: /metrics
        port: http
        scheme: https
        tlsConfig:
          insecureSkipVerify: true
    selector:
      matchLabels:
        app.kubernetes.io/component: llminferenceservice-workload
        app.kubernetes.io/name: nvidia-nemotron-nano-9b-v2

  cosmos3:
    enabled: true
    name: vss-cosmos3-metrics
    podMetricsEndpoints:
      - interval: 15s
        path: /metrics
        port: http
        scheme: https
        tlsConfig:
          insecureSkipVerify: true
    selector:
      matchLabels:
        app.kubernetes.io/component: llminferenceservice-workload
        app.kubernetes.io/name: nvidia-cosmos3-reasoner
