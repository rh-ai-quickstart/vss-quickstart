global:
  namespace: observability-hub

# Naming overrides consumed by the chart helpers.
common:
  nameOverride: ""
  fullnameOverride: ""

serviceAccount:
  create: true
  name: "otel-collector"

rbac:
  create: true

collector:
  enabled: true
  name: "otel-collector"
  mode: deployment
  upgradeStrategy: automatic
  managementState: managed
  replicas: 1
  resources: {}

  observability:
    metrics:
      enableMetrics: true

  config:
    exporters:
      debug:
        verbosity: basic

    # Model serving metrics (vLLM /metrics) are scraped by OpenShift User
    # Workload Monitoring via the PodMonitors in the uwm chart, not here.
    # This collector only handles OTLP telemetry pushed to it.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 100
        timeout: 1s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 95
        spike_limit_percentage: 25

    service:
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - batch
            - memory_limiter
          exporters:
            - debug
        traces:
          receivers:
            - otlp
          processors:
            - batch
            - memory_limiter
          exporters:
            - debug
      telemetry:
        metrics:
          level: basic
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
